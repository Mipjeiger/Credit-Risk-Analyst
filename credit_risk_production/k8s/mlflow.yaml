apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: credit-risk
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: credit_risk_production-mlflow/credit-risk-mlflow:latest
          envFrom:
            - secretRef:
                name: mlflow-postgres-secret
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: credit-risk
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }