apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: credit-risk
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: credit-risk-api
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: credit-risk-api
            action: keep
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: credit-risk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: credit-risk
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: credit-risk
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: credit-risk
roleRef:
  kind: Role
  name: prometheus-pod-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: credit-risk
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: credit-risk
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090