apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: credit-risk
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: credit_risk_production-grafana/grafana:latest
          envFrom:
            - secretRef:
                name: grafana-secret
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: credit-risk
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000