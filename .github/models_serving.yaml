name: Models Serving — Register, Rollout, A/B & Autoscale

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options: [register, deploy, canary, promote, rollback, ab-test, batch-score]
        default: register
      model_name:
        description: "Registered model name"
        default: credit_risk_bundle
      model_version:
        description: "Version (blank = latest from Production)"
        default: ""
      canary_weight:
        description: "A/B weight for canary (0-100)"
        default: "10"
      traffic_split:
        description: "A/B split e.g. 90/10"
        default: "90/10"
  push:
    branches: [main]
    paths:
      - "credit_risk_production/database/LLM/outputs_llm/model_artifacts/**"
      - "credit_risk_production/ml/register.py"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/Mipjeiger
  NAMESPACE: credit-risk
  MODEL_NAME: credit_risk_bundle

jobs:
  # ──────────────────────────────────────────────────────────
  # A. REGISTER MODEL TO MLFLOW REGISTRY
  # ──────────────────────────────────────────────────────────
  register-model:
    name: Register Model to MLflow
    if: github.event_name == 'push' || inputs.action == 'register'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.register.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: credit_risk_production
        run: |
          pip install --upgrade pip
          pip install -r requirements/ml.txt

      - name: Register via MLflow
        id: register
        working-directory: credit_risk_production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: credit_risk_ml
        run: |
          python -m ml.register | tee out.txt
          VERSION=$(grep -oP 'v\K[0-9]+' out.txt | tail -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Registered v$VERSION"

  # ──────────────────────────────────────────────────────────
  # B. VALIDATE MODEL (schema, latency, accuracy)
  # ──────────────────────────────────────────────────────────
  validate-model:
    name: Validate Model (Latency, Accuracy, Schema)
    runs-on: ubuntu-latest
    needs: register-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: credit_risk_production
        run: |
          pip install --upgrade pip
          pip install -r requirements/ml.txt

      - name: Latency + accuracy SLA check
        working-directory: credit_risk_production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ needs.register-model.outputs.version }}
        run: |
          python - <<'PY'
          import os, time, mlflow, numpy as np, pandas as pd, joblib
          from pathlib import Path

          bundle = joblib.load(Path("database/LLM/outputs_llm/model_artifacts/model_bundle.joblib"))
          models = bundle["models"]
          feats  = bundle["feature_columns"]

          # Build synthetic batch
          X = pd.DataFrame(np.random.randn(100, len(feats)), columns=feats)
          X = bundle["scaler"].transform(X)

          # Latency SLA: p95 < 200ms per prediction
          latencies = []
          for _ in range(50):
              t0 = time.perf_counter()
              models["Gradient Boosting"].predict_proba(X[:1])
              latencies.append((time.perf_counter() - t0) * 1000)
          p95 = float(np.percentile(latencies, 95))
          print(f"p95 latency: {p95:.2f} ms")
          assert p95 < 200, f"❌ Latency SLA failed: {p95}ms"

          # Schema check
          assert len(feats) > 10
          print("✅ Latency + schema OK")

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.set_experiment("credit_risk_serving")
          with mlflow.start_run(run_name="latency_check"):
              mlflow.log_metric("p95_latency_ms", p95)
              mlflow.log_param("model_version", os.environ["MODEL_VERSION"])
          PY

  # ──────────────────────────────────────────────────────────
  # C. DEPLOY MODEL (real-time endpoint)
  # ──────────────────────────────────────────────────────────
  deploy-model:
    name: Deploy Model Endpoint
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    needs: [register-model, validate-model]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy model-server (realtime)
        env:
          VERSION: ${{ needs.register-model.outputs.version }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: model-server
            namespace: ${NAMESPACE}
            labels: { app: model-server, version: "v${VERSION}" }
          spec:
            replicas: 2
            selector: { matchLabels: { app: model-server } }
            template:
              metadata:
                labels: { app: model-server, version: "v${VERSION}" }
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8000"
              spec:
                containers:
                  - name: server
                    image: ${REGISTRY}/${IMAGE_PREFIX}-api:${{ github.sha }}
                    env:
                      - { name: MODEL_VERSION, value: "v${VERSION}" }
                      - { name: MLFLOW_MODEL_NAME, value: "${MODEL_NAME}" }
                      - { name: MLFLOW_STAGE, value: "Production" }
                    ports: [{ containerPort: 8000 }]
                    resources:
                      requests: { cpu: 250m, memory: 512Mi }
                      limits:   { cpu: 1000m, memory: 2Gi }
                    readinessProbe:
                      httpGet: { path: /ready, port: 8000 }
                      initialDelaySeconds: 10
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: model-server
            namespace: ${NAMESPACE}
          spec:
            selector: { app: model-server }
            ports: [{ port: 80, targetPort: 8000 }]
          ---
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: model-server-hpa
            namespace: ${NAMESPACE}
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: model-server
            minReplicas: 2
            maxReplicas: 10
            metrics:
              - type: Resource
                resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
              - type: Pods
                pods:
                  metric: { name: api_request_latency_seconds }
                  target: { type: AverageValue, averageValue: 200m }
          EOF

          kubectl -n ${NAMESPACE} rollout status deploy/model-server --timeout=180s

      - name: Smoke test deployed model
        run: |
          kubectl -n ${NAMESPACE} port-forward svc/model-server 8080:80 &
          sleep 8
          curl -sf http://localhost:8080/health
          echo "✅ Model endpoint healthy"

  # ──────────────────────────────────────────────────────────
  # D. CANARY / A/B SPLIT
  # ──────────────────────────────────────────────────────────
  canary-rollout:
    name: Canary Rollout (A/B Split)
    if: inputs.action == 'canary' || inputs.action == 'ab-test'
    runs-on: ubuntu-latest
    needs: [register-model, validate-model]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Install Istio + Flagger
        run: |
          kubectl apply -f https://flagger.app/install.yaml || true

      - name: Create Flagger canary
        env:
          WEIGHT: ${{ inputs.canary_weight }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: flagger.app/v1beta1
          kind: Canary
          metadata:
            name: model-server
            namespace: ${NAMESPACE}
          spec:
            targetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: model-server
            service:
              port: 80
            analysis:
              interval: 1m
              threshold: 5
              stepWeight: ${WEIGHT}
              maxWeight: 50
              metrics:
                - name: request-success-rate
                  thresholdRange: { min: 99 }
                  interval: 1m
                - name: request-duration
                  thresholdRange: { max: 500 }
                  interval: 1m
          EOF

      - name: Watch canary progress
        run: |
          kubectl -n ${NAMESPACE} wait --for=condition=Promoted canary/model-server --timeout=30m || true

  # ──────────────────────────────────────────────────────────
  # E. PROMOTE TO 100%
  # ──────────────────────────────────────────────────────────
  promote:
    name: Promote Model to 100% Traffic
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Promote canary
        run: |
          kubectl -n ${NAMESPACE} patch canary/model-server \
            --type=merge \
            -p '{"spec":{"analysis":{"stepWeight":100}}}'
          echo "✅ Promoted to 100%"

  # ──────────────────────────────────────────────────────────
  # F. ROLLBACK
  # ──────────────────────────────────────────────────────────
  rollback:
    name: Rollback Model
    if: inputs.action == 'rollback' || failure()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Rollback deployment
        run: |
          kubectl -n ${NAMESPACE} rollout undo deploy/model-server
          kubectl -n ${NAMESPACE} rollout status deploy/model-server --timeout=120s
          echo "✅ Rollback complete"

  # ──────────────────────────────────────────────────────────
  # G. BATCH SCORING (async / offline)
  # ──────────────────────────────────────────────────────────
  batch-score:
    name: Batch Scoring Job
    if: inputs.action == 'batch-score'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Launch batch Job
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: batch-score-$(date +%s)
            namespace: ${NAMESPACE}
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: scorer
                    image: ${REGISTRY}/${IMAGE_PREFIX}-api:${{ github.sha }}
                    command: ["python", "-m", "ml.batch_score"]
                    env:
                      - { name: BATCH_INPUT,  value: "s3://credit-risk/input/today.parquet" }
                      - { name: BATCH_OUTPUT, value: "s3://credit-risk/output/today_scored.parquet" }
          EOF
          echo "✅ Batch scoring job launched"

  # ──────────────────────────────────────────────────────────
  # H. LINEAGE / GOVERNANCE RECORD
  # ──────────────────────────────────────────────────────────
  record-lineage:
    name: Record Model Lineage
    runs-on: ubuntu-latest
    needs: [register-model]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Write lineage to MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          pip install mlflow
          python - <<'PY'
          import os, mlflow
          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.set_experiment("credit_risk_governance")
          with mlflow.start_run(run_name="lineage"):
              mlflow.log_param("git_sha", os.environ.get("GITHUB_SHA", ""))
              mlflow.log_param("actor",    os.environ.get("GITHUB_ACTOR", ""))
              mlflow.log_param("workflow", "models_serving")
              mlflow.log_param("version",  "${{ needs.register-model.outputs.version }}")
              mlflow.set_tags({
                  "commit": "${{ github.sha }}",
                  "ref":    "${{ github.ref }}",
                  "run_id": "${{ github.run_id }}",
              })
          print("✅ Lineage recorded")
          PY