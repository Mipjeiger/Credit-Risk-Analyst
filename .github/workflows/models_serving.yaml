name: Models Serving — Register, Rollout, A/B & Autoscale

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options: [register, deploy, canary, promote, rollback, ab-test, batch-score]
        default: register
      model_name:
        description: "Registered model name"
        default: credit_risk_bundle
      model_version:
        description: "Version (blank = latest from Production)"
        default: ""
      canary_weight:
        description: "A/B weight for canary (0-100)"
        default: "10"
      traffic_split:
        description: "A/B split e.g. 90/10"
        default: "90/10"
  push:
    branches: [main]
    paths:
      - "credit_risk_production/database/LLM/outputs_llm/model_artifacts/**"
      - "credit_risk_production/ml/register.py"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/credit-risk
  NAMESPACE: credit-risk
  MODEL_NAME: credit_risk_bundle

jobs:
  register-model:
    name: Register Model to MLflow
    if: github.event_name == 'push' || inputs.action == 'register'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.register.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: credit_risk_production
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn xgboost joblib pandas pyarrow

      - name: Register via MLflow
        id: register
        working-directory: credit_risk_production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: credit_risk_ml
        run: |
          python -m ml.register | tee out.txt
          VERSION=$(grep -oE 'v[0-9]+' out.txt | tail -1 | tr -d 'v')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from ml.register output"
            cat out.txt
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Registered v$VERSION"

  validate-model:
    name: Validate Model (Latency, Accuracy, Schema)
    runs-on: ubuntu-latest
    needs: register-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: credit_risk_production
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn xgboost joblib pandas numpy pyarrow

      - name: Latency + accuracy SLA check
        working-directory: credit_risk_production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ needs.register-model.outputs.version }}
        run: |
          python - <<'PY'
          import os, time, mlflow, numpy as np, pandas as pd, joblib
          from pathlib import Path

          bundle = joblib.load(Path("database/LLM/outputs_llm/model_artifacts/model_bundle.joblib"))
          models = bundle["models"]
          feats  = bundle["feature_columns"]

          X = pd.DataFrame(np.random.randn(100, len(feats)), columns=feats)
          X = bundle["scaler"].transform(X)

          latencies = []
          for _ in range(50):
              t0 = time.perf_counter()
              models["Gradient Boosting"].predict_proba(X[:1])
              latencies.append((time.perf_counter() - t0) * 1000)
          p95 = float(np.percentile(latencies, 95))
          print(f"p95 latency: {p95:.2f} ms")
          assert p95 < 200, f"❌ Latency SLA failed: {p95}ms"
          assert len(feats) > 10

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.set_experiment("credit_risk_serving")
          with mlflow.start_run(run_name="latency_check"):
              mlflow.log_metric("p95_latency_ms", p95)
              mlflow.log_param("model_version", os.environ["MODEL_VERSION"])
          print("✅ Latency + schema OK")
          PY

  deploy-model:
    name: Deploy Model Endpoint
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    needs: [register-model, validate-model]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy model-server
        env:
          VERSION: ${{ needs.register-model.outputs.version }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: model-server
            namespace: ${NAMESPACE}
            labels: { app: model-server, version: "v${VERSION}" }
          spec:
            replicas: 2
            selector: { matchLabels: { app: model-server } }
            template:
              metadata:
                labels: { app: model-server, version: "v${VERSION}" }
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8000"
              spec:
                containers:
                  - name: server
                    image: ${REGISTRY}/${IMAGE_PREFIX}-api:${{ github.sha }}
                    env:
                      - { name: MODEL_VERSION, value: "v${VERSION}" }
                      - { name: MLFLOW_MODEL_NAME, value: "${MODEL_NAME}" }
                      - { name: MLFLOW_STAGE, value: "Production" }
                    ports: [{ containerPort: 8000 }]
                    readinessProbe:
                      httpGet: { path: /ready, port: 8000 }
                      initialDelaySeconds: 10
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: model-server, namespace: ${NAMESPACE} }
          spec:
            selector: { app: model-server }
            ports: [{ port: 80, targetPort: 8000 }]
          EOF
          kubectl -n ${NAMESPACE} rollout status deploy/model-server --timeout=180s

      - name: Smoke test
        run: |
          kubectl -n ${NAMESPACE} port-forward svc/model-server 8080:80 &
          sleep 8
          curl -sf http://localhost:8080/health